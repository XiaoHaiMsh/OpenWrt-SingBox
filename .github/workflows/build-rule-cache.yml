name: Build sing-box Rule Cache

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download sing-box 1.14.0
        run: |
          set -e

          VERSION="1.14.0"

          curl -fL \
            -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"

          tar -xzf sing-box.tar.gz

          chmod +x "sing-box-${VERSION}-linux-amd64/sing-box"

          "sing-box-${VERSION}-linux-amd64/sing-box" version

          echo "SING_BOX=$PWD/sing-box-${VERSION}-linux-amd64/sing-box" >> "$GITHUB_ENV"

      - name: Download rule-sets
        run: |
          set -e

          mkdir -p rules

          curl -fL \
            -o rules/geoip-cn.srs \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.srs"

          curl -fL \
            -o rules/geosite-cn.srs \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.srs"

          curl -fL \
            -o rules/geosite-noncn.srs \
            "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/geolocation-!cn.srs"

          ls -lh rules/

      - name: Prepare cache environment
        run: |
          set -e

          rm -rf cache
          mkdir -p cache

          cat > config.json <<'EOF'
          {
            "log": {
              "level": "info"
            },
            "route": {
              "rule_set": [
                {
                  "type": "remote",
                  "tag": "geoip-cn",
                  "format": "binary",
                  "url": "http://127.0.0.1:8000/geoip-cn.srs",
                  "update_interval": "24h"
                },
                {
                  "type": "remote",
                  "tag": "geosite-cn",
                  "format": "binary",
                  "url": "http://127.0.0.1:8000/geosite-cn.srs",
                  "update_interval": "24h"
                },
                {
                  "type": "remote",
                  "tag": "geosite-noncn",
                  "format": "binary",
                  "url": "http://127.0.0.1:8000/geosite-noncn.srs",
                  "update_interval": "24h"
                }
              ]
            },
            "experimental": {
              "cache_file": {
                "enabled": true,
                "path": "cache/cache.db",
                "store_fakeip": false,
                "store_rdrc": false,
                "store_dns": false
              }
            }
          }
          EOF

      - name: Check config
        run: |
          set -e
          "$SING_BOX" check -c config.json

      - name: Generate cache.db
        run: |
          set -e

          cd rules
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          HTTP_PID=$!
          cd ..

          sleep 2

          "$SING_BOX" run -c config.json &
          SB_PID=$!

          echo "Waiting for rule-sets..."

          for i in $(seq 1 30); do
            if [ -s cache/cache.db ]; then
              echo "cache.db created."
              break
            fi
            sleep 1
          done

          kill "$SB_PID" 2>/dev/null || true
          kill "$HTTP_PID" 2>/dev/null || true

          wait "$SB_PID" 2>/dev/null || true

          test -s cache/cache.db

          echo
          echo "Generated cache.db:"
          ls -lh cache/cache.db

      - name: Upload cache.db
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-rule-cache
          path: cache/cache.db
          retention-days: 7
