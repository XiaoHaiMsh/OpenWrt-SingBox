name: Build rule-set cache.db

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: '要使用的 sing-box 版本 tag（例如 v1.11.0），必须和目标路由器上实际运行的版本一致'
        required: true
        default: 'v1.11.0'

jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Download sing-box
        run: |
          VER="${{ github.event.inputs.singbox_version }}"
          VER_NUM="${VER#v}"
          curl -fL -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${VER}/sing-box-${VER_NUM}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv "sing-box-${VER_NUM}-linux-amd64/sing-box" ./sing-box
          chmod +x ./sing-box
          ./sing-box version

      - name: Write temp config
        run: |
          cat > config.json <<'EOF'
          {
            "log": { "level": "warn", "timestamp": true },
            "outbounds": [
              { "type": "direct", "tag": "direct" }
            ],
            "route": {
              "rule_set": [
                {
                  "type": "remote",
                  "tag": "geoip-cn",
                  "format": "binary",
                  "url": "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.srs"
                },
                {
                  "type": "remote",
                  "tag": "geosite-cn",
                  "format": "binary",
                  "url": "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/cn.srs"
                },
                {
                  "type": "remote",
                  "tag": "geosite-noncn",
                  "format": "binary",
                  "url": "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/geolocation-!cn.srs"
                }
              ],
              "rules": [
                { "rule_set": "geoip-cn", "outbound": "direct" },
                { "rule_set": "geosite-cn", "outbound": "direct" },
                { "rule_set": "geosite-noncn", "outbound": "direct" }
              ],
              "final": "direct"
            },
            "experimental": {
              "cache_file": {
                "enabled": true,
                "path": "cache.db",
                "store_dns": false
              }
            }
          }
          EOF

      - name: Run sing-box briefly to warm the cache
        run: |
          rm -f cache.db
          ./sing-box run -c config.json &
          PID=$!
          # 轮询等 cache.db 出现并稳定下来（下载+落盘需要几秒）
          for i in $(seq 1 30); do
            sleep 1
            if [ -s cache.db ]; then
              sleep 5
              break
            fi
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Verify cache.db is non-empty
        run: |
          test -s cache.db
          ls -lh cache.db
          file cache.db

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cache.db
          path: cache.db
          retention-days: 7
